<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --accent:  #00C6FF;
      --accent2: #0072FF;
      --bg:      #04070F;
      --bg2:     #080F1E;
      --bg3:     #0C1526;
      --border:  rgba(0,198,255,.15);
      --text:    #E8F4FF;
      --muted:   #5A7A9A;
      --glow:    0 0 30px rgba(0,198,255,.35);
      --glow-lg: 0 0 60px rgba(0,198,255,.5);
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-track{background:var(--bg)}
    ::-webkit-scrollbar-thumb{background:var(--accent);border-radius:5px}

    .blob{position:fixed;width:500px;height:500px;border-radius:50%;
      background:radial-gradient(circle,rgba(0,198,255,.07) 0%,transparent 70%);
      pointer-events:none;transform:translate(-50%,-50%);transition:left .5s,top .5s;z-index:0}

    /* ══ SIDEBAR ══ */
    .sidebar{position:fixed;left:0;top:0;height:100vh;width:72px;
      background:var(--bg2);border-right:1px solid var(--border);
      display:flex;flex-direction:column;align-items:center;
      padding:25px 0;gap:8px;z-index:100}
    .logo{width:42px;height:42px;border-radius:12px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      display:flex;align-items:center;justify-content:center;
      font-size:1.2rem;margin-bottom:20px;box-shadow:var(--glow)}
    .nav-btn{width:46px;height:46px;border-radius:14px;border:none;
      background:transparent;color:var(--muted);
      display:flex;align-items:center;justify-content:center;
      font-size:1.1rem;cursor:pointer;transition:all .3s;position:relative}
    .nav-btn::after{content:attr(data-tip);position:absolute;left:calc(100% + 15px);
      background:var(--bg3);border:1px solid var(--border);color:var(--text);
      padding:5px 12px;border-radius:8px;font-family:'Cairo',sans-serif;
      font-size:.8rem;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
    .nav-btn:hover::after{opacity:1}
    .nav-btn:hover,.nav-btn.active{color:var(--accent);background:rgba(0,198,255,.08)}
    .nav-btn.active::before{content:'';position:absolute;right:0;top:50%;
      transform:translateY(-50%);width:3px;height:28px;
      background:var(--accent);border-radius:3px 0 0 3px}

    /* ══ WRAPPER ══ */
    .wrapper{margin-left:72px;min-height:100vh;position:relative;z-index:1}

    /* ══ HERO ══ */
    .hero{min-height:100vh;display:flex;align-items:center;
      padding:60px 80px;position:relative;overflow:hidden}
    .hero-grid{display:grid;grid-template-columns:1fr 420px;
      gap:60px;align-items:center;width:100%;max-width:1200px;margin:0 auto}
    .hero::before{content:'';position:absolute;inset:0;
      background-image:linear-gradient(rgba(0,198,255,.03) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,198,255,.03) 1px,transparent 1px);
      background-size:50px 50px}
    .hero::after{content:'';position:absolute;top:-200px;left:-200px;
      width:600px;height:600px;border-radius:50%;
      background:radial-gradient(circle,rgba(0,198,255,.08),transparent 70%);pointer-events:none}
    .hero-badge{display:inline-flex;align-items:center;gap:8px;
      background:rgba(0,198,255,.08);border:1px solid var(--border);
      color:var(--accent);padding:7px 18px;border-radius:30px;
      font-size:.85rem;font-weight:600;margin-bottom:25px}
    .hero-badge .dot{width:8px;height:8px;border-radius:50%;
      background:var(--accent);animation:blink 1.5s infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
    .hero h1{font-size:4rem;font-weight:900;line-height:1.1;margin-bottom:20px}
    .hero h1 .name{display:block;
      background:linear-gradient(90deg,var(--accent),var(--accent2));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .hero p{color:var(--muted);font-size:1.1rem;line-height:1.8;max-width:480px;margin-bottom:35px}
    .hero-btns{display:flex;gap:15px;flex-wrap:wrap}
    .btn-primary{padding:13px 32px;border-radius:14px;border:none;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:#fff;font-family:'Cairo',sans-serif;font-weight:700;font-size:1rem;
      cursor:pointer;transition:all .3s;box-shadow:0 0 25px rgba(0,198,255,.35)}
    .btn-primary:hover{transform:translateY(-3px);box-shadow:var(--glow-lg)}
    .btn-outline{padding:13px 32px;border-radius:14px;border:1px solid var(--border);
      background:transparent;color:var(--text);font-family:'Cairo',sans-serif;
      font-weight:600;font-size:1rem;cursor:pointer;transition:all .3s}
    .btn-outline:hover{border-color:var(--accent);color:var(--accent);background:rgba(0,198,255,.05)}

    /* Avatar Card */
    .avatar-wrap{position:relative;display:flex;justify-content:center}
    .avatar-card{width:320px;height:380px;border-radius:28px;
      background:var(--bg3);border:1px solid var(--border);
      display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:20px;position:relative;overflow:hidden;box-shadow:var(--glow)}
    .avatar-card::before{content:'';position:absolute;top:-40%;left:-40%;
      width:180%;height:180%;border-radius:50%;
      background:radial-gradient(circle,rgba(0,198,255,.05),transparent 60%)}
    .avatar-icon{width:110px;height:110px;border-radius:50%;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      display:flex;align-items:center;justify-content:center;
      font-size:3rem;position:relative;z-index:1;box-shadow:var(--glow-lg)}
    .avatar-name{font-size:1.4rem;font-weight:800;position:relative;z-index:1}
    .avatar-role{color:var(--muted);font-size:.9rem;position:relative;z-index:1}
    .avatar-stats{display:flex;gap:25px;position:relative;z-index:1;
      border-top:1px solid var(--border);padding-top:20px;width:80%;justify-content:center}
    .avatar-stat{text-align:center}
    .avatar-stat .num{font-size:1.5rem;font-weight:900;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .avatar-stat .lbl{color:var(--muted);font-size:.7rem}

    /* ══ SECTION ══ */
    section{padding:80px 80px;max-width:1272px;margin:0 auto}
    .sec-header{margin-bottom:50px}
    .sec-eyebrow{color:var(--accent);font-size:.8rem;font-weight:700;
      text-transform:uppercase;letter-spacing:3px;margin-bottom:10px}
    .sec-title{font-size:2.5rem;font-weight:900}
    .sec-title span{background:linear-gradient(90deg,var(--accent),var(--accent2));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .sec-line{width:50px;height:3px;margin-top:14px;border-radius:3px;
      background:linear-gradient(90deg,var(--accent),var(--accent2))}

    /* ══ FILTER ══ */
    .filter-wrap{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:40px}
    .fpill{padding:8px 22px;border-radius:30px;border:1px solid var(--border);
      background:transparent;color:var(--muted);font-family:'Cairo',sans-serif;
      font-size:.88rem;cursor:pointer;transition:all .3s}
    .fpill.active,.fpill:hover{background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:#fff;border-color:transparent;box-shadow:0 0 15px rgba(0,198,255,.3)}

    /* ══ GRID ══ */
    .projects-grid{display:grid;
      grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:28px}
    .pcard{background:var(--bg2);border:1px solid var(--border);
      border-radius:22px;overflow:hidden;transition:all .35s;position:relative}
    .pcard::after{content:'';position:absolute;inset:0;border-radius:22px;
      background:linear-gradient(135deg,rgba(0,198,255,.03),transparent);
      opacity:0;transition:opacity .3s;pointer-events:none}
    .pcard:hover{transform:translateY(-8px);border-color:rgba(0,198,255,.4);
      box-shadow:0 20px 60px rgba(0,198,255,.2),0 0 0 1px rgba(0,198,255,.1)}
    .pcard:hover::after{opacity:1}
    .vid-box{position:relative;padding-top:56.25%;background:#000;cursor:pointer}
    .vid-box iframe{position:absolute;inset:0;width:100%;height:100%;border:none}
    .vid-thumb{position:absolute;inset:0;display:flex;align-items:center;
      justify-content:center;background-size:cover;background-position:center}
    .vid-thumb::before{content:'';position:absolute;inset:0;
      background:linear-gradient(135deg,rgba(0,114,255,.3),rgba(0,198,255,.2))}
    .play-circle{width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.95);
      display:flex;align-items:center;justify-content:center;font-size:1.5rem;
      color:var(--accent2);transition:all .3s;position:relative;z-index:1;
      box-shadow:0 0 30px rgba(0,198,255,.5)}
    .vid-thumb:hover .play-circle{transform:scale(1.12);box-shadow:0 0 50px rgba(0,198,255,.8)}
    .cat-pill{position:absolute;top:14px;right:14px;z-index:2;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:#fff;padding:4px 14px;border-radius:20px;font-size:.72rem;font-weight:700}
    .pbody{padding:22px}
    .ptitle{font-size:1.1rem;font-weight:800;margin-bottom:8px}
    .pdesc{color:var(--muted);font-size:.88rem;line-height:1.65;margin-bottom:16px}
    .pfoot{display:flex;align-items:center;justify-content:space-between}
    .pdate{color:var(--muted);font-size:.78rem;display:flex;align-items:center;gap:5px}
    .yt-link{padding:8px 18px;border-radius:10px;border:1px solid var(--border);
      background:transparent;color:var(--accent);font-family:'Cairo',sans-serif;
      font-size:.82rem;cursor:pointer;transition:all .3s;display:flex;align-items:center;gap:6px;
      text-decoration:none}
    .yt-link:hover{background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:#fff;border-color:transparent;box-shadow:0 0 15px rgba(0,198,255,.3)}

    /* ══ ABOUT ══ */
    .about-layout{display:grid;grid-template-columns:300px 1fr;gap:40px;align-items:start}
    .about-left{background:var(--bg2);border:1px solid var(--border);
      border-radius:22px;padding:35px;text-align:center;position:sticky;top:30px}
    .about-avatar{width:100px;height:100px;border-radius:50%;margin:0 auto 15px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      display:flex;align-items:center;justify-content:center;
      font-size:2.5rem;box-shadow:var(--glow-lg)}
    .about-name{font-size:1.3rem;font-weight:800;margin-bottom:5px}
    .about-role-txt{color:var(--muted);font-size:.88rem;margin-bottom:20px}
    .social-row{display:flex;gap:10px;justify-content:center}
    .soc-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--border);
      background:var(--bg3);color:var(--muted);display:flex;align-items:center;
      justify-content:center;text-decoration:none;transition:all .3s}
    .soc-btn:hover{background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:#fff;border-color:transparent;box-shadow:0 0 15px rgba(0,198,255,.4)}
    .about-bio-txt{margin-top:20px;padding-top:20px;border-top:1px solid var(--border);
      color:var(--muted);font-size:.88rem;line-height:1.7;text-align:right}
    .about-right .info-card{background:var(--bg2);border:1px solid var(--border);
      border-radius:22px;padding:35px;margin-bottom:25px}
    .about-right .info-card h4{font-size:1rem;margin-bottom:20px;
      display:flex;align-items:center;gap:8px}
    .about-right .info-card h4 i{color:var(--accent)}
    .skills-grid{display:flex;flex-wrap:wrap;gap:10px}
    .skill-pill{padding:7px 18px;border-radius:20px;
      background:rgba(0,198,255,.08);border:1px solid rgba(0,198,255,.2);
      font-size:.85rem;color:var(--accent)}

    /* ══ EMPTY ══ */
    .empty{grid-column:1/-1;text-align:center;padding:70px 20px}
    .empty-icon{width:80px;height:80px;border-radius:24px;
      background:rgba(0,198,255,.05);border:1px solid var(--border);
      display:flex;align-items:center;justify-content:center;
      font-size:2rem;color:var(--muted);margin:0 auto 20px}
    .empty p{color:var(--muted);font-size:1rem}

    /* ══ FOOTER ══ */
    footer{text-align:center;padding:30px;border-top:1px solid var(--border);
      color:var(--muted);font-size:.85rem;margin-left:72px}
    footer span{color:var(--accent)}

    /* ══ MOBILE ══ */
    .topbar{display:none;position:fixed;top:0;left:0;right:0;
      background:rgba(4,7,15,.9);backdrop-filter:blur(10px);
      border-bottom:1px solid var(--border);padding:12px 20px;
      z-index:100;justify-content:space-between;align-items:center}
    .topbar-logo{background:linear-gradient(135deg,var(--accent),var(--accent2));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      font-weight:900;font-size:1.1rem}
    .topbar-btns{display:flex;gap:5px}
    .topbar-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border);
      background:transparent;color:var(--muted);font-family:'Cairo',sans-serif;
      font-size:.8rem;cursor:pointer;transition:all .3s}
    .topbar-btn.active,.topbar-btn:hover{
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:#fff;border-color:transparent}
    @media(max-width:900px){
      .sidebar{display:none}.wrapper{margin-left:0}
      .topbar{display:flex}.hero{padding:80px 25px 40px}
      .hero-grid{grid-template-columns:1fr;gap:30px}
      .hero h1{font-size:2.4rem}.avatar-wrap{display:none}
      section{padding:50px 25px}
      .about-layout{grid-template-columns:1fr}
      .about-left{position:static}
      footer{margin-left:0}
    }
  </style>
</head>
<body>

<div class="blob" id="blob"></div>

<!-- MOBILE NAV -->
<div class="topbar">
  <div class="topbar-logo">Portfolio</div>
  <div class="topbar-btns">
    <button class="topbar-btn active" onclick="show('home',this)">الرئيسية</button>
    <button class="topbar-btn" onclick="show('work',this)">أعمالي</button>
    <button class="topbar-btn" onclick="show('about',this)">عني</button>
  </div>
</div>

<!-- SIDEBAR -->
<nav class="sidebar">
  <div class="logo">⚡</div>
  <button class="nav-btn active" data-tip="الرئيسية" onclick="show('home',this)"><i class="fas fa-house"></i></button>
  <button class="nav-btn" data-tip="أعمالي"   onclick="show('work',this)"><i class="fas fa-film"></i></button>
  <button class="nav-btn" data-tip="عني"       onclick="show('about',this)"><i class="fas fa-user"></i></button>
</nav>

<div class="wrapper">

  <!-- ══ HERO ══ -->
  <div id="home-section">
    <div class="hero">
      <div class="hero-grid">
        <div>
          <div class="hero-badge"><span class="dot"></span> متاح للعمل</div>
          <h1>مرحباً، أنا<span class="name" id="heroName">اسمك هنا</span></h1>
          <p id="heroBio">مصمم مبدع وشغوف بالتفاصيل · أعمل على تحويل الأفكار إلى تجارب بصرية استثنائية.</p>
          <div class="hero-btns">
            <button class="btn-primary" onclick="show('work', document.querySelectorAll('.nav-btn')[1])">
              <i class="fas fa-eye"></i> شاهد أعمالي
            </button>
            <button class="btn-outline" onclick="show('about', document.querySelectorAll('.nav-btn')[2])">
              <i class="fas fa-user"></i> تعرف عليّ
            </button>
          </div>
        </div>
        <div class="avatar-wrap">
          <div class="avatar-card">
            <div class="avatar-icon">🎨</div>
            <div class="avatar-name" id="heroNameCard">عباس محمد</div>
            <div class="avatar-role" id="heroRoleCard">مصمم | مطور</div>
            <div class="avatar-stats">
              <div class="avatar-stat">
                <div class="num" id="statP">0</div>
                <div class="lbl">مشروع</div>
              </div>
              <div class="avatar-stat">
                <div class="num" id="statC">0</div>
                <div class="lbl">تصنيف</div>
              </div>
              <div class="avatar-stat">
                <div class="num" id="statY">-</div>
                <div class="lbl">منذ</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ══ WORK ══ -->
  <section id="work-section" style="display:none">
    <div class="sec-header">
      <div class="sec-eyebrow">معرض الأعمال</div>
      <h2 class="sec-title">أحدث <span>مشاريعي</span></h2>
      <div class="sec-line"></div>
    </div>
    <div class="filter-wrap" id="filterWrap">
      <button class="fpill active" onclick="filterBy('all',this)">الكل</button>
    </div>
    <div class="projects-grid" id="grid"></div>
  </section>

  <!-- ══ ABOUT ══ -->
  <section id="about-section" style="display:none">
    <div class="sec-header">
      <div class="sec-eyebrow">التعريف بي</div>
      <h2 class="sec-title">من <span>أنا؟</span></h2>
      <div class="sec-line"></div>
    </div>
    <div class="about-layout">
      <div class="about-left">
        <div class="about-avatar">🎨</div>
        <div class="about-name" id="aName">—</div>
        <div class="about-role-txt" id="aRole">—</div>
        <div class="social-row">
          <a class="soc-btn" id="sYT" href="#" target="_blank"><i class="fab fa-youtube"></i></a>
          <a class="soc-btn" id="sIG" href="#" target="_blank"><i class="fab fa-instagram"></i></a>
          <a class="soc-btn" id="sTW" href="#" target="_blank"><i class="fab fa-twitter"></i></a>
          <a class="soc-btn" id="sLI" href="#" target="_blank"><i class="fab fa-linkedin"></i></a>
        </div>
        <div class="about-bio-txt" id="aBio">—</div>
      </div>
      <div class="about-right">
        <div class="info-card">
          <h4><i class="fas fa-star"></i> المهارات</h4>
          <div class="skills-grid" id="skillsGrid"><span style="color:var(--muted)">لا توجد مهارات بعد</span></div>
        </div>
      </div>
    </div>
  </section>

</div><!-- /wrapper -->

<footer>صُنع بـ <span>❤️</span> · جميع الحقوق محفوظة</footer>

<script>
  // بيانات من localStorage (يملؤها ملف admin.html)
  let projects = JSON.parse(localStorage.getItem('pf_projects') || '[]');
  let about    = JSON.parse(localStorage.getItem('pf_about')    || '{}');
  let skills   = JSON.parse(localStorage.getItem('pf_skills')   || '[]');
  let activeF  = 'all';

  window.onload = () => { applyAbout(); renderGrid(); updateStats(); };

  document.addEventListener('mousemove', e => {
    const b = document.getElementById('blob');
    b.style.left = e.clientX + 'px';
    b.style.top  = e.clientY + 'px';
  });

  function show(name, btn) {
    ['home','work','about'].forEach(s =>
      document.getElementById(s+'-section').style.display = 'none');
    document.getElementById(name+'-section').style.display = 'block';
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.topbar-btn').forEach(b => b.classList.remove('active'));
    if(btn) btn.classList.add('active');
  }

  function getYTId(url) {
    const p=[/youtube\.com\/watch\?v=([^&]+)/,/youtu\.be\/([^?&]+)/,
             /youtube\.com\/embed\/([^?&]+)/,/youtube\.com\/shorts\/([^?&]+)/];
    for(const r of p){ const m=url.match(r); if(m) return m[1]; }
    return null;
  }

  function renderGrid(f=activeF) {
    activeF = f;
    const g = document.getElementById('grid');
    const list = f==='all' ? projects : projects.filter(p=>p.cat===f);
    if(!list.length) {
      g.innerHTML=`<div class="empty">
        <div class="empty-icon"><i class="fas fa-photo-film"></i></div>
        <p>لا توجد أعمال بعد.</p></div>`;
      return;
    }
    g.innerHTML = list.map(p=>`
      <div class="pcard">
        <div class="vid-box">
          <div class="vid-thumb"
               style="background-image:url('https://img.youtube.com/vi/${p.ytId}/hqdefault.jpg')"
               onclick="play(this,'${p.ytId}')">
            <div class="play-circle"><i class="fas fa-play"></i></div>
          </div>
          <div class="cat-pill">${p.cat}</div>
        </div>
        <div class="pbody">
          <div class="ptitle">${p.ttl}</div>
          ${p.desc?`<div class="pdesc">${p.desc}</div>`:''}
          <div class="pfoot">
            <div class="pdate"><i class="far fa-clock"></i> ${p.date}</div>
            <a class="yt-link" href="${p.url}" target="_blank">
              <i class="fab fa-youtube"></i> شاهد على يوتيوب
            </a>
          </div>
        </div>
      </div>`).join('');
    updateFilterBar();
  }

  function play(thumb, id) {
    const w = thumb.parentElement;
    const f = document.createElement('iframe');
    f.src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
    f.allow = 'autoplay;encrypted-media'; f.allowFullscreen = true;
    w.innerHTML = ''; w.appendChild(f);
  }

  function updateFilterBar() {
    const bar = document.getElementById('filterWrap');
    const cats = [...new Set(projects.map(p=>p.cat))];
    bar.innerHTML = `<button class="fpill ${activeF==='all'?'active':''}" onclick="filterBy('all',this)">الكل</button>`;
    cats.forEach(c =>
      bar.innerHTML += `<button class="fpill ${activeF===c?'active':''}" onclick="filterBy('${c}',this)">${c}</button>`);
  }

  function filterBy(c, btn) {
    document.querySelectorAll('.fpill').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderGrid(c);
  }

  function updateStats() {
    document.getElementById('statP').textContent = projects.length;
    document.getElementById('statC').textContent = new Set(projects.map(p=>p.cat)).size;
    if(about.year) document.getElementById('statY').textContent = about.year;
  }

  function applyAbout() {
    document.getElementById('heroName').textContent    = about.name || 'اسمك هنا';
    document.getElementById('heroNameCard').textContent= about.name || 'اسمك هنا';
    document.getElementById('heroRoleCard').textContent= about.role || 'مصمم | مطور';
    document.getElementById('heroBio').textContent     = about.bio  || 'مصمم مبدع وشغوف بالتفاصيل.';
    document.getElementById('aName').textContent = about.name || '—';
    document.getElementById('aRole').textContent = about.role || '—';
    document.getElementById('aBio').textContent  = about.bio  || '—';
    if(about.yt) document.getElementById('sYT').href = about.yt;
    if(about.ig) document.getElementById('sIG').href = about.ig;
    if(about.tw) document.getElementById('sTW').href = about.tw;
    if(about.li) document.getElementById('sLI').href = about.li;
    const sg = document.getElementById('skillsGrid');
    sg.innerHTML = skills.length
      ? skills.map(s=>`<div class="skill-pill">${s}</div>`).join('')
      : '<span style="color:var(--muted)">لا توجد مهارات بعد</span>';
  }
</script>
</body>
</html>
